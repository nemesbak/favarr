# ─────────────────────────────────────────────────────────────────────────────
#  Favarr ❤️  ·  Cambia SOLO las líneas con 👉   /   Change ONLY the 👉 lines
# ─────────────────────────────────────────────────────────────────────────────
services:
  favarr:
    image: nemesbak/favarr:latest
    container_name: favarr
    restart: unless-stopped
    volumes:
      # 👉 Carpeta NUEVA y vacía, en el mismo disco que tus películas
      #    A NEW empty folder, on the same disk as your movies
      - /mnt/user/media/descubre:/catalogo
      - ./favarr-datos:/datos
    environment:
      # 👉 Seerr / Jellyseerr / Overseerr
      SEERR_URL: http://192.168.1.10:5055
      SEERR_API_KEY: pega-aqui-la-clave

      # 👉 Jellyfin  (¿no lo usas? pon # delante de estas 3 líneas / don't use it? put # in front)
      JELLYFIN_URL: http://192.168.1.10:8096
      JELLYFIN_API_KEY: pega-aqui-la-clave
      JELLYFIN_CARPETA: /media/descubre    # la carpeta de arriba vista desde Jellyfin / as Jellyfin sees it

      # 👉 Emby  (¿lo usas? quita la # de estas 3 líneas / use it? remove the #)
      # EMBY_URL: http://192.168.1.10:8096
      # EMBY_API_KEY: pega-aqui-la-clave
      # EMBY_CARPETA: /media/descubre      # la carpeta de arriba vista desde Emby / as Emby sees it

      IDIOMA: es            # es · en
      TZ: Europe/Madrid

      # ── Opcional / optional ─────────────────────────────────────────────
      # Los límites salen de los cupos de Seerr. Freno extra opcional / optional extra limit:
      # LIMITE_DIA: 0             # peticiones por persona y día / per person per day
      # MAX_PENDIENTES: 0         # esperando a la vez / waiting at once
      # SOLO_TEMPORADA_1: si      # series: solo la 1.ª temporada / first season only
      # PELICULAS: 100
      # SERIES: 50
      # TELEGRAM_TOKEN: ""
      # TELEGRAM_ADMIN: ""
      # TELEGRAM_USUARIOS: "ana=123456,juan=789012"
